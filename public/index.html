<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>StrausTube — видеохостинг</title>
<meta name="description" content="StrausTube — демонстрационный видеохостинг, работающий полностью в браузере. Аккаунты, каналы, видео и комментарии хранятся локально на вашем устройстве.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23ff0033'/%3E%3Cpath%20d='M26%2018l16%2014-16%2014z'%20fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="demo-bar" role="note">
  <strong>Демо-проект.</strong> StrausTube — локальная демонстрация интерфейса видеохостинга. Все аккаунты, видео и комментарии хранятся только в вашем браузере (localStorage) и никуда не отправляются. Не используйте настоящие пароли и не публикуйте личные данные.
  <button type="button" class="demo-bar__close" id="demoBarClose" aria-label="Скрыть уведомление">&times;</button>
</div>

<header class="topbar" id="topbar">
  <button class="icon-btn nav-toggle" id="navToggle" type="button" aria-label="Меню">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
  </button>

  <a class="brand" href="#/" data-route="home" aria-label="StrausTube — на главную">
    <svg class="brand__logo" viewBox="0 0 64 44" width="60" height="42" aria-hidden="true">
      <rect x="0" y="0" width="64" height="44" rx="11" fill="#ff0033"/>
      <path d="M26 13.5 45 22l-19 8.5z" fill="#fff"/>
    </svg>
    <span class="brand__name">StrausTube</span>
  </a>

  <form class="search" id="searchForm" role="search" autocomplete="off">
    <input type="search" id="searchInput" name="q" placeholder="Поиск видео и каналов" aria-label="Поиск">
    <button type="submit" class="search__btn" aria-label="Найти">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </form>

  <div class="topbar__right">
    <a class="icon-btn" href="#/upload" data-route="upload" title="Загрузить видео" aria-label="Загрузить видео">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
    </a>
    <div class="account" id="accountArea"></div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <nav class="sidebar__nav" id="sidebarNav" aria-label="Основная навигация"></nav>
    <div class="sidebar__foot">
      <a href="#/about">О проекте</a>
      <a href="#/privacy">Конфиденциальность</a>
      <span>&copy; StrausTube</span>
    </div>
  </aside>

  <main class="content" id="view" tabindex="-1"></main>
</div>

<div id="modals" class="modals"></div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
